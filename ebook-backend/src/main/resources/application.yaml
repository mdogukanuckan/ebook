application:
  security:
    jwt:
      # Required, no default. Base64, at least 256 bits: openssl rand -base64 32
      secret-key: ${JWT_SECRET_KEY}
      expiration: 86400000
  subscription:
    # Lets users activate a plan for themselves without paying. Keep off in production until payments exist.
    self-service-enabled: ${SUBSCRIPTION_SELF_SERVICE_ENABLED:false}

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ebookdb}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: ${SPRING_JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha

server:
  port: ${SERVER_PORT:8080}